services:
  postgres:
    image: postgres:16-alpine
    container_name: jupiter-postgres
    restart: unless-stopped
    ports:
    - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-jupiter}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h postgres -U ${DB_USER:-postgres} -d ${DB_NAME:-jupiter}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: jupiter-rabbitmq
    restart: unless-stopped
    ports:
    - "5672:5672"
    - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
  minio:
    image: quay.io/minio/minio:latest
    container_name: jupiter-minio
    restart: unless-stopped
    ports:
    - "9000:9000"
    - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
  migrate:
    build:
      context: ./infra/migrations
      dockerfile: Dockerfile
    image: jupiter-migrate
    container_name: jupiter-migrate
    working_dir: /migrations
    volumes:
    - ./infra/migrations:/migrations
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-jupiter}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: jupiter-gateway
    restart: unless-stopped
    ports:
    - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-jupiter}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-15}
      JWT_REFRESH_EXPIRY_HOURS: ${JWT_REFRESH_EXPIRY_HOURS:-168}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-jupiter-videos}
      MINIO_USE_SSL: 'false'
      MINIO_PUBLIC_USE_SSL: 'false'
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:5173}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LIVE_GROQ_MODEL: llama3-8b-8192
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-EXAVITQu4vr4xnSDxMaL}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_GROWTH: ${STRIPE_PRICE_GROWTH:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_SCALE: ${STRIPE_PRICE_SCALE:-}
      STRIPE_PRICE_TOPUP_S: ${STRIPE_PRICE_TOPUP_S:-}
      STRIPE_PRICE_TOPUP_M: ${STRIPE_PRICE_TOPUP_M:-}
      STRIPE_PRICE_TOPUP_L: ${STRIPE_PRICE_TOPUP_L:-}
      BILLING_ENFORCED: '0'
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-http://localhost:5173/billing-success.html}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-http://localhost:5173/billing-cancel.html}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
  worker-pose:
    build:
      context: ./ai-workers/pose
      dockerfile: Dockerfile
    container_name: jupiter-worker-pose
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-jupiter}
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      AWS_REGION: us-east-1
      POSE_JOBS_QUEUE: pose.jobs
      FEATURES_RESULTS_QUEUE: features.results
      POSE_SEGMENT_SECONDS: 5
      POSE_MAX_VIDEO_SECONDS: 600
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import os,sys; sys.exit(0 if any('pose_worker' in open('/proc/'+p+'/cmdline','rb').read().decode('latin1')
        for p in os.listdir('/proc') if p.isdigit()) else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
  worker-whisper:
    build:
      context: ./ai-workers/whisper
      dockerfile: Dockerfile
    container_name: jupiter-worker-whisper
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-jupiter}
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      AWS_REGION: us-east-1
      WHISPER_JOBS_QUEUE: whisper.jobs
      FEATURES_RESULTS_QUEUE: features.results
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      WHISPER_MODEL: whisper-1
      GROQ_WHISPER_MODEL: whisper-large-v3
      WHISPER_MAX_VIDEO_SECONDS: 480
      WHISPER_CHUNK_SECONDS: 120
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import os,sys; sys.exit(0 if any('whisper_worker' in open('/proc/'+p+'/cmdline','rb').read().decode('latin1')
        for p in os.listdir('/proc') if p.isdigit()) else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  worker-prosody:
    build:
      context: ./ai-workers
      dockerfile: prosody/Dockerfile
    container_name: jupiter-worker-prosody
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-jupiter}
      PROSODY_QUEUE: prosody.jobs
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      AWS_REGION: us-east-1
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8001/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
  worker-scoring:
    build:
      context: ./ai-workers
      dockerfile: scoring/Dockerfile
    container_name: jupiter-worker-scoring
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-jupiter}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-jupiter}
      SCORING_QUEUE: scoring.jobs
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8002/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  postgres_data: null
  rabbitmq_data: null
  minio_data: null
